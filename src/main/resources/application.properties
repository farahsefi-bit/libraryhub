spring.datasource.username=${DB_USER:libuser}
spring.datasource.password=${DB_PASSWORD:lib1234}
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:TGlicmFyeUh1YlN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZzIwMjYtQ2hhbmdlTWVJblByb2Qh}
